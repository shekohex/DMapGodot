<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid pattern representing a map -->
  <rect x="1" y="1" width="14" height="14" fill="#4a90e2" stroke="#2c5aa0" stroke-width="1"/>
  
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.7">
    <line x1="5" y1="1" x2="5" y2="15"/>
    <line x1="9" y1="1" x2="9" y2="15"/>
    <line x1="13" y1="1" x2="13" y2="15"/>
    <line x1="1" y1="5" x2="15" y2="5"/>
    <line x1="1" y1="9" x2="15" y2="9"/>
    <line x1="1" y1="13" x2="15" y2="13"/>
  </g>
  
  <!-- Small squares to represent tiles -->
  <rect x="2" y="2" width="2" height="2" fill="#ffffff" opacity="0.8"/>
  <rect x="6" y="2" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="10" y="6" width="2" height="2" fill="#ffffff" opacity="0.8"/>
  <rect x="2" y="10" width="2" height="2" fill="#ffffff" opacity="0.6"/>
</svg>